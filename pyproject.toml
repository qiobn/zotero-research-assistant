[project]
name = "zotero-research-assistant"
version = "0.2.0"
description = "AI-powered Zotero research assistant — a standalone MCP server with 32 tools for literature search, reading analysis, citation management, and review writing."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["zotero", "mcp", "research", "literature-review", "semantic-search", "citation", "ai", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "pyzotero>=1.6.11",
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
    "fastmcp>=2.10",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pydantic>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.12",
]
cnki = [
    "playwright>=1.49",
]
tables = [
    # ML-based table extraction (ZRA_TABLE_MODE=ml) via Microsoft Table
    # Transformer. torch/transformers come in via sentence-transformers.
    "torchvision>=0.19",
    "timm>=1.0",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/qiobn/zotero-research-assistant"
Repository = "https://github.com/qiobn/zotero-research-assistant"
Issues = "https://github.com/qiobn/zotero-research-assistant/issues"

[project.scripts]
zra-mcp = "project_a_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_core", "project_a_mcp"]

[tool.ruff]
src = ["research_core", "project_a_mcp", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
