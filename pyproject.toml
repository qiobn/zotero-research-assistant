[project]
name = "zotero-research-assistant"
version = "0.1.0"
description = "AI-powered Zotero research assistant — 29 MCP tools for literature search, reading analysis, citation management, and review writing."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
keywords = ["zotero", "mcp", "research", "literature-review", "semantic-search", "citation", "ai", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "pyzotero>=1.6.11",
    "litellm>=1.74",
    "openai>=1.50",
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
    "fastapi[standard]>=0.115",
    "uvicorn>=0.34",
    "sse-starlette>=2.3",
    "fastmcp>=2.10",
    "aiosqlite>=0.21",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pydantic>=2.10",
]

[project.optional-dependencies]
agent = [
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-litellm>=0.2",
    "instructor>=1.10",
    "tavily-python>=0.7",
    "duckduckgo-search>=8.0",
    "rank-bm25>=0.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.12",
]
cnki = [
    "playwright>=1.49",
]

[project.urls]
Homepage = "https://github.com/qiobn/zotero-research-assistant"
Repository = "https://github.com/qiobn/zotero-research-assistant"
Issues = "https://github.com/qiobn/zotero-research-assistant/issues"

[project.scripts]
zra-mcp = "project_a_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_core", "project_a_mcp"]

[tool.ruff]
src = ["research_core", "project_a_mcp", "project_b_agent", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
