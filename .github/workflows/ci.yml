name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff — source only, skip scripts)
        run: ruff check --select E,W,F --ignore E501 research_core/ project_a_mcp/

      - name: Unit + core tests
        # tests/mcp are integration tests that need a live Zotero + index, so
        # they are intentionally excluded from CI.
        # test_cnki_helpers requires playwright (CNKI extra), skip in CI.
        run: pytest tests/core tests/unit -q --ignore=tests/unit/test_cnki_helpers.py

      - name: Wheel package smoke test
        run: |
          python -m build --wheel --outdir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              files = set(archive.namelist())
          required = {
              "project_a_mcp/skills/bilingual-search/SKILL.md",
              "project_a_mcp/skills/graph-expansion/SKILL.md",
          }
          missing = required - files
          assert not missing, f"Wheel is missing packaged skills: {sorted(missing)}"
          PY
